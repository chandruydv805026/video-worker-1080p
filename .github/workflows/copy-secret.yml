name: Copy Gemini Secret
on:
  workflow_dispatch:
    inputs:
      pat_token:
        description: 'GitHub PAT Token'
        required: true

jobs:
  copy_secret:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: pip install requests pynacl

      - name: Encrypt and Set Secret in Target Repo
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAT_TOKEN: ${{ github.event.inputs.pat_token }}
        run: |
          python -c '
          import os, base64, requests
          from nacl import public

          gemini_key = os.environ.get("GEMINI_KEY", "").strip()
          pat_token = os.environ.get("PAT_TOKEN", "").strip()

          if not gemini_key:
              print("[ERROR] GEMINI_API_KEY is empty in source repo!")
              exit(1)

          headers = {
              "Authorization": f"Bearer {pat_token}",
              "Accept": "application/vnd.github.v3+json"
          }

          # 1. Get target repo public key
          r_key = requests.get("https://api.github.com/repos/chandruydv805026/plotshield-worker/actions/secrets/public-key", headers=headers)
          r_key.raise_for_status()
          kd = r_key.json()
          pk = kd["key"]
          kid = kd["key_id"]

          # 2. Encrypt
          pk_bytes = base64.b64decode(pk)
          box = public.SealedBox(public.PublicKey(pk_bytes))
          enc = box.encrypt(gemini_key.encode("utf-8"))
          enc_b64 = base64.b64encode(enc).decode("utf-8")

          # 3. Put secret in target repo
          r_put = requests.put(
              "https://api.github.com/repos/chandruydv805026/plotshield-worker/actions/secrets/GEMINI_API_KEY",
              headers=headers,
              json={"encrypted_value": enc_b64, "key_id": kid}
          )
          if r_put.status_code in (201, 204):
              print("[SUCCESS] GEMINI_API_KEY successfully copied to plotshield-worker!")
          else:
              print(f"[ERROR] Failed to set secret: {r_put.status_code} {r_put.text}")
              exit(1)
          '
