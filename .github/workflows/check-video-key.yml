name: Check Video Worker Key
on:
  workflow_dispatch:
jobs:
  ord:
    runs-on: ubuntu-latest
    steps:
      - name: Print ords
        env:
          MY_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c 'import os; k = os.environ.get("MY_KEY", ""); print("ORDS=" + str([ord(c) for c in k]))'
